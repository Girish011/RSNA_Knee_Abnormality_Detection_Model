experiment:
  id: baseline_dinov2_s
  track: main
  notes: "DINOv2-small study-level baseline; image-only inference"

paths:
  train_csv: /kaggle/input/rsna-knee-abnormality-detection/train.csv
  train_series_csv: /kaggle/input/rsna-knee-abnormality-detection/train_series.csv
  series_root: /kaggle/input/rsna-knee-abnormality-detection/train_series
  folds: data/folds/folds_v1.csv
  output_dir: outputs/experiments/baseline_dinov2_s
  # Bundle Meta DINOv2 weights as a public Kaggle Model/Dataset for offline submit.
  backbone_weights: null

data:
  max_series: 3
  n_slices: 12
  image_size: 224
  center_bias: true
  require_plane_coverage: true

model:
  backbone: dinov2_vits14
  freeze_backbone_epochs: 1
  dropout: 0.1
  pretrained: true

train:
  n_folds: 5
  seed: 42
  epochs: 5
  batch_size: 2
  lr: 3.0e-4
  weight_decay: 0.05
  amp: true
  num_workers: 2

loss:
  type: masked_bce
  use_confidence: true
