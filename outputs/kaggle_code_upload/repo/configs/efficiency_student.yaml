experiment:
  id: efficiency_student
  track: efficiency
  notes: "Distilled DINOv2-small; minimize Efficiency = AUC/(Benchmark-maxAUC) + Runtime/32400"

paths:
  train_csv: /kaggle/input/rsna-knee-abnormality-detection/train.csv
  train_series_csv: /kaggle/input/rsna-knee-abnormality-detection/train_series.csv
  series_root: /kaggle/input/rsna-knee-abnormality-detection/train_series
  folds: data/folds/folds_v1.csv
  teacher_oof: outputs/experiments/main_dinov2_b/oof_probs.npy
  output_dir: outputs/experiments/efficiency_student
  backbone_weights: null

data:
  max_series: 3
  n_slices: 8
  image_size: 224
  center_bias: true
  require_plane_coverage: true

model:
  backbone: dinov2_vits14
  freeze_backbone_epochs: 0
  dropout: 0.05
  pretrained: true
  single_checkpoint: true

train:
  n_folds: 5
  seed: 42
  epochs: 6
  batch_size: 4
  lr: 3.0e-4
  weight_decay: 0.05
  amp: true
  distill_temperature: 2.0
  distill_alpha: 0.7

infer:
  amp: true
  compile: false
  measure_cold_start: true

efficiency:
  runtime_budget_seconds: 32400
  assumed_max_auc: [0.85, 0.88, 0.90]
  must_beat_benchmark: true
