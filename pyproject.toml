[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection — DINOv2 multiseries study classifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RSNA Knee Team" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pydicom>=2.4",
  "pillow>=10.0",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
torch = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
kaggle = [
  "kaggle>=1.6",
]

[project.scripts]
rsna-train = "rsna_knee.training.train_loop:main"
rsna-infer = "rsna_knee.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
