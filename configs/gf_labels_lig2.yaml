# Greenfield labels iterate #2: gap-fill Medial Meniscus only on weak_v1
# Drop MCL (and ACL) fills vs lig1. Image recipe unchanged (cache_gf_v0).
# Ruler = true OOF gold vs 0.6144 + 0.005 = 0.6194.

experiment:
  id: gf_labels_lig2
  track: main
  notes: "Same 3x12x224 frozen-S; teacher=weak_labels_gf_lig2 (v1 + Med Men gap-fill only)"

paths:
  train_csv: /kaggle/input/competitions/rsna-knee-abnormality-detection/train.csv
  train_series_csv: /kaggle/input/competitions/rsna-knee-abnormality-detection/train_series.csv
  folds: data/folds/folds_v1.csv
  weak_labels: data/processed/weak_labels_gf_lig2.csv
  series_picks: outputs/eda/gf_v0_series_picks.csv
  cache_dir: /kaggle/input/datasets/girishbose/rsna-knee-cache-gf-v0/cache_gf_v0
  output_dir: outputs/experiments/gf_labels_lig2
  backbone_weights: null

data:
  max_series: 3
  n_slices: 12
  image_size: 224
  center_bias: true
  require_plane_coverage: true
  plane_order: ["Sagittal", "Coronal", "Axial"]
  prefer_fluid_sensitive: true

model:
  backbone: dinov2_vits14
  freeze_backbone_epochs: 5
  dropout: 0.1
  pretrained: true

train:
  n_folds: 5
  fold: 0
  seed: 42
  epochs: 5
  batch_size: 2
  lr: 3.0e-4
  weight_decay: 0.05
  amp: true
  num_workers: 2

loss:
  type: masked_bce
  use_confidence: true
  pos_weight: 1.0

ruler:
  primary: true_oof_gold58_macro_auc
  baseline_oof_gold58: 0.6144
  margin: 0.005
  smoke: weak_label_oof_auc
