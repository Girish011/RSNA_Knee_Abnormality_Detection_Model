experiment:
  id: rank1_v6c_b
  track: main
  notes: >
    Rank-1 image lever on adopted v6c labels: frozen DINOv2-B + per-label plane
    routing + per-label pos_weight from weak-label prevalence. Uses cache_v1
    (3x12x224) for immediate train; cache_v3 (4x16 + ACL sagittal bias) is the
    follow-on cache rebuild. Pre-registered keep vs v6c BCE full-58 gold 0.7023
    (margin 0.005). Target public LB 0.95 requires this stack + 5-fold ensemble
    + cache_v3 — not guaranteed.

paths:
  train_csv: /kaggle/input/competitions/rsna-knee-abnormality-detection/train.csv
  folds: data/folds/folds_v1.csv
  weak_labels: data/processed/weak_labels_v6c.csv
  output_dir: outputs/experiments/rank1_v6c_b
  backbone_weights: null

data:
  max_series: 3
  n_slices: 12
  image_size: 224
  center_bias: true
  require_plane_coverage: true
  sagittal_acl_bias: false

model:
  backbone: dinov2_vitb14
  freeze_backbone_epochs: 12
  dropout: 0.15
  pretrained: true
  label_plane_routing: true

train:
  n_folds: 5
  seed: 42
  epochs: 12
  batch_size: 1
  lr: 1.5e-4
  weight_decay: 0.05
  unfreeze_lr_mult: 0.05
  amp: true
  num_workers: 2

loss:
  type: masked_bce
  mode: bce
  use_confidence: true
  pos_weight: per_label_prevalence
  pos_weight_cap: 8.0
  min_weak_confidence: 0.5

cache_v3:
  max_series: 4
  n_slices: 16
  sagittal_acl_bias: true
