experiment:
  id: label_query_dinov2_s_384
  track: main
  notes: "Order-aware plane-routed label queries over frozen DINOv2-S features"

data:
  max_series: 3
  n_slices: 12
  image_size: 384
  center_bias: true
  require_plane_coverage: true

model:
  type: label_query
  backbone: dinov2_vits14
  input_dim: 384
  hidden_dim: 384
  num_heads: 6
  sequence_layers: 1
  plane_prior_penalty: 2.0
  freeze_backbone_epochs: 5
  dropout: 0.1

train:
  n_folds: 5
  seed: 42
  epochs: 5
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  amp: true
  num_workers: 2

loss:
  type: masked_bce
  use_confidence: true
  pos_weight: 1.0
