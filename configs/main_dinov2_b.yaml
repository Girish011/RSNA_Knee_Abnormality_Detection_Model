experiment:
  id: main_dinov2_b
  track: main
  notes: "DINOv2-base multiseries main model; weak labels + expert fine-tune"

paths:
  train_csv: /kaggle/input/rsna-knee-abnormality-detection/train.csv
  train_series_csv: /kaggle/input/rsna-knee-abnormality-detection/train_series.csv
  series_root: /kaggle/input/rsna-knee-abnormality-detection/train_series
  folds: data/folds/folds_v1.csv
  weak_labels: data/processed/weak_labels_v1.csv
  output_dir: outputs/experiments/main_dinov2_b
  backbone_weights: null

data:
  max_series: 5
  n_slices: 16
  image_size: 224
  center_bias: true
  require_plane_coverage: true

model:
  backbone: dinov2_vitb14
  freeze_backbone_epochs: 1
  dropout: 0.15
  pretrained: true

train:
  n_folds: 5
  seed: 42
  epochs: 8
  batch_size: 1
  lr: 1.5e-4
  weight_decay: 0.05
  amp: true
  num_workers: 2
  curriculum:
    - phase: weak_pretrain
      epochs: 4
    - phase: expert_finetune
      epochs: 4

loss:
  type: masked_bce
  use_confidence: true
  min_weak_confidence: 0.5
