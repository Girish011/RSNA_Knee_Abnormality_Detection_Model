experiment:
  id: main_dinov2_b_v2
  track: main
  notes: "DINOv2-B + weak_labels_v2 (FR/ES/EN/DE) + freeze-then-gentle-unfreeze + pos_weight"

paths:
  train_csv: /kaggle/input/competitions/rsna-knee-abnormality-detection/train.csv
  folds: data/folds/folds_v1.csv
  weak_labels: data/processed/weak_labels_v2.csv
  output_dir: outputs/experiments/main_dinov2_b_v2
  backbone_weights: null

data:
  max_series: 4
  n_slices: 16
  image_size: 224
  center_bias: true
  require_plane_coverage: true

model:
  backbone: dinov2_vitb14
  freeze_backbone_epochs: 4
  dropout: 0.15
  pretrained: true

train:
  n_folds: 5
  seed: 42
  epochs: 8
  batch_size: 1
  lr: 1.5e-4
  weight_decay: 0.05
  unfreeze_lr_mult: 0.05
  amp: true
  num_workers: 2

loss:
  type: masked_bce
  use_confidence: true
  pos_weight: 2.0
  min_weak_confidence: 0.5
